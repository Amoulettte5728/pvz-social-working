<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PvZ Social Remake</title>
    <!--
      This used to be a standalone Ruffle embed with a handful of userId/
      flashvars params that don't actually do anything - Flow.as hardcodes
      this.userId = 245953145 regardless of what's passed in, and
      Config.HOST_URL is likewise a hardcoded constant, not read from a
      flashvar. Browser play now lives at /play, gated behind the login
      system (server.py's /accounts) so it always uses the right save -
      redirecting there instead of duplicating (and drifting out of sync
      with) that page.
    -->
    <meta http-equiv="refresh" content="0; url=/accounts">
</head>
<body>
    <p>Redirecting to <a href="/accounts">/accounts</a>&hellip;</p>
</body>
</html>
